[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmm-device-sim"
version = "0.1.0"
description = "Desktop TMM simulator for multilayer thin-film photodiodes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PySide6>=6.6",
]

[project.scripts]
tmm-device-sim = "tmm_device_sim.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
